services:
  postgres:
    restart: unless-stopped

  api:
    restart: unless-stopped
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      MESSAGE_FINGERPRINT_SECRET: ${MESSAGE_FINGERPRINT_SECRET:?MESSAGE_FINGERPRINT_SECRET is required}

  frontend:
    restart: unless-stopped
